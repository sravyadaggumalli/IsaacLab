params:
  seed: 42

  # environment wrapper clipping
  env:
    clip_observations: 100.0
    clip_actions: 100.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [256, 256, 128]  # Two layers of same size helps with feature extraction
      activation: elu
      d2rl: False  # Disabling for simplicity

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False
  load_path: ''

  config:
    name: franka_lift
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True  # Critical for long-term credit assignment
    num_actors: -1
    reward_shaper:
      scale_value: 1.0  # Adjusted for reasonable reward values
    normalize_advantage: True
    gamma: 0.998  # Higher discount factor - critical change
    tau: 0.95
    learning_rate: 2e-4
    lr_schedule: adaptive
    schedule_type: legacy
    kl_threshold: 0.02  # Increased to allow more policy change
    score_to_win: 100000000
    max_epochs: 500
    save_best_after: 100
    save_frequency: 50
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.01  # Significantly increased for exploration after reaching
    truncate_grads: True
    e_clip: 0.1  # Tighter clipping for more stable learning
    horizon_length: 96  # CRITICAL CHANGE: Much longer horizon to see lifting rewards
    minibatch_size: 8192  # Smaller for more update iterations
    mini_epochs: 4  # Fewer to prevent overfitting to reaching behavior
    critic_coef: 1  # Reduced to make policy updates more significant
    clip_value: True
    clip_actions: True
    seq_len: 4
    bounds_loss_coef: 0.0001