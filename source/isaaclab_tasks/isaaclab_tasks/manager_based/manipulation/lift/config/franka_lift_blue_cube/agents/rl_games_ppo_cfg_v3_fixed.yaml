params:
  seed: 42

  # environment wrapper clipping
  env:
    clip_observations: 100.0
    clip_actions: 100.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: tanh  # Try tanh as it's widely supported
        
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.0  # Lower initial value for stability
        fixed_sigma: False  # Keep learnable standard deviations
        # Add log_std_bounds if your version supports it directly in the network config
        log_std_bounds: [-10, 0]
    mlp:
      units: [256, 128, 64]  # Original network size for now
      activation: elu
      d2rl: False  # Disabled initially for stability

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False # flag which sets whether to load the checkpoint
  load_path: '' # path to the checkpoint to load

  config:
    name: franka_lift
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: False
    num_actors: -1
    reward_shaper:
      scale_value: 0.01  # Original value
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 1e-5  # Very low learning rate for stability
    lr_schedule: adaptive
    schedule_type: legacy
    kl_threshold: 0.01
    score_to_win: 100000000
    max_epochs: 5000
    save_best_after: 100
    save_frequency: 50
    print_stats: True
    grad_norm: 0.5  # Reduced for stability with learnable sigma
    entropy_coef: 0.001
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 24  # Original value
    minibatch_size: 24576
    mini_epochs: 8
    critic_coef: 4
    clip_value: True
    clip_actions: True  # Enable action clipping for stability
    seq_len: 4
    bounds_loss_coef: 0.001  # Increased slightly
    
    # These parameters help with learnable sigma stability
    # Comment out any that cause errors with your version
    bound_action_grad: True  # If supported
    bounds_loss_scale: 0.0001  # If supported
    min_std: 0.02  # Minimum standard deviation if supported
    max_std: 1.0  # Maximum standard deviation if supported
    
    # Alternative names that might be supported in your version
    min_log_std: -10  # Lower bound for log_std
    max_log_std: 0  # Upper bound for log_std