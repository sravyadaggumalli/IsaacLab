params:
  seed: 42

  # environment wrapper clipping
  env:
    clip_observations: 100.0
    clip_actions: 100.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: False
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0  # Default value
        fixed_sigma: True  # Keep fixed for stability, since we need precision
    mlp:
      units: [512, 256, 128]  # Increased network capacity for complex task
      activation: elu
      d2rl: True  # Enable residual connections for better gradient flow

      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: False # flag which sets whether to load the checkpoint
  load_path: '' # path to the checkpoint to load

  config:
    name: franka_lift
    env_name: rlgpu
    device: 'cuda:0'
    device_name: 'cuda:0'
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    value_bootstrap: True  # Enable value bootstrapping for better credit assignment
    num_actors: -1
    reward_shaper:
      scale_value: 1.0  # Increased to make rewards more impactful
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 5e-4  # Increase learning rate for faster learning
    lr_schedule: adaptive
    schedule_type: legacy
    kl_threshold: 0.008  # Slightly tighter KL constraint
    score_to_win: 100000000
    max_epochs: 1500
    save_best_after: 100
    save_frequency: 50
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0005  # Reduced for more exploitation (precise movements)
    truncate_grads: True
    e_clip: 0.2
    horizon_length: 48  # Double the horizon length for this multi-stage task
    minibatch_size: 24576
    mini_epochs: 12  # Increased mini-epochs for better policy updates
    critic_coef: 2  # Reduced to prevent over-conservative behavior
    clip_value: True
    clip_actions: False
    seq_len: 4
    bounds_loss_coef: 0.01  # Increased to keep actions in bounds (important for precision)